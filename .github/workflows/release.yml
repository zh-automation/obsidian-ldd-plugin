# Publishes a GitHub release when a version tag arrives (0.2.0, or 0.2.0-beta.1 as a pre-release).
#
# The Forgejo repo is the source of truth. Its push mirror carries commits and tags to GitHub, and
# this workflow turns each tag into a release with main.js, manifest.json, and styles.css attached,
# which is what BRAT and Obsidian install from. Release steps: README.md, "Releasing".
name: Release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
      - "[0-9]+.[0-9]+.[0-9]+-*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      # BRAT and Obsidian need the tag, the release name, and manifest.json's version to match.
      - name: Check tag matches manifest.json
        run: |
          VERSION=$(node -p "require('./manifest.json').version")
          if [ "$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match manifest.json version $VERSION. Bump with 'npm version <x.y.z>'."
            exit 1
          fi

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          FLAGS=""
          case "$TAG" in *-*) FLAGS="--prerelease" ;; esac
          gh release create "$TAG" main.js manifest.json styles.css --title "$TAG" --generate-notes $FLAGS
